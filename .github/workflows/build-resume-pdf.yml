name: Build resume PDF

on:
  push:
    branches: [main]
    paths:
      - "cv.html"
      - "profile.jpg.jpeg"
      - ".github/workflows/build-resume-pdf.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Render CV to PDF
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({ viewport: { width: 1200, height: 1600 }, deviceScaleFactor: 1 });
            await page.goto('file://' + path.resolve('cv.html'), { waitUntil: 'networkidle' });
            await page.pdf({
              path: 'resume.pdf',
              format: 'A4',
              printBackground: true,
              margin: { top: '12mm', right: '12mm', bottom: '12mm', left: '12mm' }
            });
            await browser.close();
          })();
          NODE

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          git diff --cached --quiet || git commit -m "Build downloadable resume PDF"
          git push
